name: Stable Release

on:
  workflow_run:
    workflows: ["Docker"]
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  release:
    name: Publish stable release
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Check out released commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Resolve stable version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(python -c 'from veeam_designer._version import __version__; print(__version__)')"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Stable release skipped for prerelease version $version"
            echo "stable=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "stable=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Wait for matching CI
        if: steps.version.outputs.stable == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail

          for attempt in {1..60}; do
            status="$(gh run list --workflow CI --commit "$RELEASE_SHA" --limit 1 --json status --jq '.[0].status // "missing"')"
            conclusion="$(gh run list --workflow CI --commit "$RELEASE_SHA" --limit 1 --json conclusion --jq '.[0].conclusion // ""')"

            if [[ "$status" == "completed" ]]; then
              if [[ "$conclusion" != "success" ]]; then
                echo "::error::Matching CI run concluded $conclusion"
                exit 1
              fi
              exit 0
            fi

            sleep 5
          done

          echo "::error::Timed out waiting for matching CI run"
          exit 1

      - name: Check for existing release
        if: steps.version.outputs.stable == 'true'
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release artifacts
        if: steps.version.outputs.stable == 'true' && steps.existing.outputs.exists == 'false'
        run: |
          python -m pip install -e ".[dev]"
          python -m build
          sha256sum dist/* > SHA256SUMS.txt

      - name: Verify release wheel
        if: steps.version.outputs.stable == 'true' && steps.existing.outputs.exists == 'false'
        shell: bash
        run: |
          set -euo pipefail
          python -m venv /tmp/veeam-designer-release
          /tmp/veeam-designer-release/bin/python -m pip install dist/*.whl
          installed_version="$(
            /tmp/veeam-designer-release/bin/python -c               'from veeam_designer import __version__; print(__version__)'
          )"
          test "$installed_version" = "${{ steps.version.outputs.version }}"

      - name: Publish GitHub Release
        if: steps.version.outputs.stable == 'true' && steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          gh release create "$TAG"             dist/* SHA256SUMS.txt             --target "$RELEASE_SHA"             --title "Veeam Designer $VERSION"             --generate-notes             --latest
