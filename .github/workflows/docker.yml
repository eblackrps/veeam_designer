name: Docker

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  container-security:
    name: Container security
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Build candidate image
        run: docker build --pull -t veeam-designer:scan .

      - name: Verify non-root runtime and healthcheck metadata
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker image inspect veeam-designer:scan --format '{{.Config.User}}')" = "10001:10001"
          docker image inspect veeam-designer:scan --format '{{json .Config.Healthcheck.Test}}' | grep -q '/api/health'
          docker compose config -q

      - name: Smoke test hardened runtime
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            docker rm -f veeam-designer-scan >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run -d --name veeam-designer-scan \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 256 \
            --tmpfs /tmp:size=64m,mode=1777 \
            -p 127.0.0.1:18000:8000 \
            veeam-designer:scan

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18000/api/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done

          docker logs veeam-designer-scan
          exit 1

      - name: Scan image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: veeam-designer:scan
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

  build-push:
    name: Build and publish
    if: github.event_name != 'pull_request'
    needs:
      - container-security
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        id: meta
        shell: bash
        run: |
          package_version="$(python -c 'from veeam_designer._version import __version__; print(__version__)')"

          tags=(
            "emb079/veeam-designer:latest"
            "ghcr.io/eblackrps/veeam-designer:latest"
            "emb079/veeam-designer:${package_version}"
            "ghcr.io/eblackrps/veeam-designer:${package_version}"
          )

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tags+=(
              "emb079/veeam-designer:${GITHUB_REF_NAME}"
              "ghcr.io/eblackrps/veeam-designer:${GITHUB_REF_NAME}"
            )
          fi

          {
            echo "tags<<EOF"
            printf '%s\n' "${tags[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push with SBOM and provenance
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          provenance: mode=max
          sbom: true
