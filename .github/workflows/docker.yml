name: Docker

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        id: meta
        shell: bash
        run: |
          package_version="$(python -c 'from veeam_designer._version import __version__; print(__version__)')"

          tags=(
            "emb079/veeam-designer:latest"
            "ghcr.io/eblackrps/veeam-designer:latest"
            "emb079/veeam-designer:${package_version}"
            "ghcr.io/eblackrps/veeam-designer:${package_version}"
          )

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tags+=(
              "emb079/veeam-designer:${GITHUB_REF_NAME}"
              "ghcr.io/eblackrps/veeam-designer:${GITHUB_REF_NAME}"
            )
          fi

          {
            echo "tags<<EOF"
            printf '%s\n' "${tags[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
