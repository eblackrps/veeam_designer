name: Docker

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Extra image tag to push (e.g. v2.0.0). "latest" is always pushed.'
        default: 'latest'
        required: false

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            emb079/veeam-designer:latest
            emb079/veeam-designer:${{ github.event.inputs.image_tag || github.ref_name }}
            ghcr.io/eblackrps/veeam-designer:latest
            ghcr.io/eblackrps/veeam-designer:${{ github.event.inputs.image_tag || github.ref_name }}
