name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  calculation-freeze:
    name: Calculation freeze
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Verify 5.0.0a8 calculation baseline
        shell: bash
        run: |
          set -euo pipefail
          failed=0

          while read -r expected path; do
            if [[ -z "${expected}" || "${expected:0:1}" == "#" ]]; then
              continue
            fi

            if [[ ! -f "${path}" ]]; then
              echo "::error file=${path}::Frozen calculation file is missing."
              failed=1
              continue
            fi

            actual="$(git hash-object "${path}")"
            if [[ "${actual}" != "${expected}" ]]; then
              echo "::error file=${path}::Calculation baseline changed. Expected ${expected}, found ${actual}."
              failed=1
            fi
          done < calculation-freeze.manifest

          if [[ "${failed}" -ne 0 ]]; then
            echo "::error::Calculation logic is frozen at 5.0.0a8. Advance calculation-freeze.manifest only for an approved, verified calculation change."
            exit 1
          fi

  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Format check
        run: python -m ruff format --check .

      - name: Type check
        run: python -m mypy .

      - name: Browser JS syntax check
        run: node --check ui/static/app.js

      - name: Test
        run: python -m pytest -q

      - name: Build
        run: python -m build

      - name: Build Pages bundle
        run: python tools/build_pages.py --output _site

  browser-e2e:
    name: Browser E2E
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install application and Playwright
        run: python -m pip install -e ".[dev,e2e]"

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Start web application
        shell: bash
        run: |
          set -euo pipefail
          nohup veeam-designer-web --host 127.0.0.1 --port 8000 >/tmp/veeam-designer-web.log 2>&1 &
          echo "$!" > /tmp/veeam-designer-web.pid

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/api/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done

          cat /tmp/veeam-designer-web.log
          exit 1

      - name: Run browser tests
        run: python -m pytest -q tests/e2e

      - name: Show server log on failure
        if: failure()
        run: cat /tmp/veeam-designer-web.log || true

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Audit Python dependencies
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: .
