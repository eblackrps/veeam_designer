name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          pip install flake8

      - name: Lint with flake8
        run: |
          flake8 veeam_designer/ ui/ --max-line-length=120 --ignore=E501,W503,E241

      - name: Validate config.json
        run: python -m json.tool config.json > /dev/null && echo "config.json is valid JSON"
