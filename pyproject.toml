[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "veeam-designer"
dynamic = ["version"]
description = "Web-first Veeam backup infrastructure sizing and architecture designer"
readme = "README.md"
authors = [{ name = "E. Black" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110,<1",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.9,<1",
  "pyyaml>=6,<7",
  "uvicorn>=0.29,<1",
]
keywords = ["veeam", "backup", "sizing", "architecture", "capacity-planning", "disaster-recovery"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Intended Audience :: Information Technology",
  "Intended Audience :: System Administrators",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
  "Topic :: System :: Systems Administration",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/eblackrps/veeam_designer"
Repository = "https://github.com/eblackrps/veeam_designer"
Issues = "https://github.com/eblackrps/veeam_designer/issues"

[project.scripts]
veeam-designer = "veeam_designer.cli:main"
veeam-designer-web = "ui.main:run"

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "httpx>=0.27,<1",
  "mypy>=1.11,<2",
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

[tool.setuptools.dynamic]
version = { attr = "veeam_designer._version.__version__" }

[tool.setuptools.packages.find]
include = ["veeam_designer*", "ui*"]

[tool.setuptools.package-data]
ui = ["templates/*.html", "static/*.css", "static/*.js"]
"veeam_designer.resources" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
explicit_package_bases = true
warn_unused_configs = true
exclude = [
  "^build/",
  "^dist/",
  "^_site/",
  "^setup\\.py$",
  "^veeam_designer\\.egg-info/",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
